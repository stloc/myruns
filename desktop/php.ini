; PHP embarqué dans l'application de bureau Windows.
; extension_dir et les certificats (curl.cainfo, openssl.cafile) sont passés en -d par Tauri :
; ils dépendent du dossier d'installation.

[PHP]
memory_limit = 1G
max_execution_time = 0
max_input_time = -1
; Archive de compte Strava (souvent plusieurs centaines de Mo).
upload_max_filesize = 2G
post_max_size = 2G
; Les variables d'environnement passées par Tauri doivent arriver dans $_SERVER.
variables_order = "EGPCS"
display_errors = Off
log_errors = On
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[Date]
date.timezone = Europe/Paris

extension=curl
extension=fileinfo
extension=intl
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=zip

zend_extension=opcache

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
