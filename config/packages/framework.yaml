# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    http_client:
        scoped_clients:
            # API intervals.icu : clé personnelle en authentification basique (identifiant littéral « API_KEY »).
            intervals.client:
                base_uri: 'https://intervals.icu'
                auth_basic: 'API_KEY:%env(INTERVALS_API_KEY)%'
                timeout: 30
            # Altimétrie IGN (altitude du terrain pour corriger le D+), service public sans clé.
            ign.client:
                base_uri: 'https://data.geopf.fr'
                timeout: 20
            # Altitude du terrain hors de France (Open-Meteo, modèle Copernicus), service public sans clé.
            openmeteo.client:
                base_uri: 'https://api.open-meteo.com'
                timeout: 20
            # Ville hors de France (Nominatim / OpenStreetMap) : sa charte exige un User-Agent identifiant l'application.
            nominatim.client:
                base_uri: 'https://nominatim.openstreetmap.org'
                timeout: 20
                headers:
                    User-Agent: 'MyRuns/1.0 (application personnelle de suivi de course à pied)'

when@test:
    framework:
        test: true
        # Aucun appel réseau pendant les tests (IGN, Open-Meteo, Nominatim…) : les tests de synchro injectent leur faux client.
        http_client:
            mock_response_factory: App\Tests\Double\NoNetworkResponseFactory
        session:
            storage_factory_id: session.storage.factory.mock_file
