# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Données de l'utilisateur (base SQLite, réglages, fichiers importés) : dossier fourni par l'app
    # de bureau (MYRUNS_DATA_DIR), sinon var/ du projet.
    app.default_data_dir: '%kernel.project_dir%/var'
    app.data_dir: '%env(default:app.default_data_dir:MYRUNS_DATA_DIR)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # Altitudes IGN déjà obtenues : dans le dossier de données, pour survivre à cache:clear et aux
    # mises à jour de l'app de bureau (un réimport ne refait aucun appel réseau).
    app.elevation_cache:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments: ['ign', 0, '%app.data_dir%/elevation-cache']

    # Communes déjà retrouvées (géocodage inverse IGN) : même principe.
    app.place_cache:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments: ['ign', 0, '%app.data_dir%/place-cache']

when@test:
    parameters:
        # Jamais les réglages du poste de développement pendant les tests.
        app.default_data_dir: '%kernel.project_dir%/var/test-data'

    services:
        # Jamais d'appel réel à l'API IA pendant les tests.
        App\Tests\Double\FakeCoachPlatform: ~
        App\Tests\Double\NoNetworkResponseFactory: ~
        Symfony\AI\Platform\PlatformInterface: '@App\Tests\Double\FakeCoachPlatform'
