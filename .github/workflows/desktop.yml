# Installeurs de l'application de bureau (Tauri + PHP embarqué) : Windows (NSIS) et Linux (.deb, AppImage).
# Pousser un tag « v0.2.0 » : les installeurs sont joints à une release GitHub en brouillon, à publier à la main.
name: Application de bureau

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # PHP Windows officiel (windows.php.net), version et empreinte figées.
  PHP_WINDOWS_VERSION: 8.4.26
  PHP_WINDOWS_SHA256: da68394f9193b7f6b89d0c76861a4034ae10efee7fd55a7255d8118c2acf70d7
  # PHP Linux statique (static-php-cli, build « common » : pdo_sqlite inclus, pas intl ni opcache), figé.
  PHP_LINUX_VERSION: 8.4.23
  PHP_LINUX_SHA256: 1aeed5bc7967977ca5b1da7163acd91bf9ba3ac56037045d4e91ee2ff2712bb7

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, zip
          tools: composer:v2

      - name: Application Symfony (production)
        shell: bash
        run: bin/prepare-desktop-app

      - name: PHP Windows embarqué
        shell: pwsh
        run: |
          $zip = "php-$env:PHP_WINDOWS_VERSION-nts-Win32-vs17-x64.zip"
          $urls = @("https://windows.php.net/downloads/releases/$zip", "https://windows.php.net/downloads/releases/archives/$zip")
          $downloaded = $false
          foreach ($url in $urls) {
            try { Invoke-WebRequest -Uri $url -OutFile $zip; $downloaded = $true; break } catch { Write-Host "Absent : $url" }
          }
          if (-not $downloaded) { throw "PHP $env:PHP_WINDOWS_VERSION introuvable" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:PHP_WINDOWS_SHA256) { throw "Empreinte SHA256 inattendue : $hash" }
          Expand-Archive $zip -DestinationPath desktop/build/php
          Copy-Item desktop/php.ini desktop/build/php/php.ini

          # Certificats racines pour HTTPS (intervals.icu, Anthropic) : PHP Windows n'en fournit pas.
          Invoke-WebRequest -Uri https://curl.se/ca/cacert.pem -OutFile desktop/build/php/cacert.pem
          Invoke-WebRequest -Uri https://curl.se/ca/cacert.pem.sha256 -OutFile cacert.pem.sha256
          $expected = ((Get-Content cacert.pem.sha256 -Raw) -split '\s+')[0].ToLower()
          $actual = (Get-FileHash desktop/build/php/cacert.pem -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Empreinte du cacert.pem inattendue" }

          # Vérification : extensions chargées par le PHP embarqué.
          & desktop/build/php/php.exe -c desktop/build/php/php.ini -d "extension_dir=desktop/build/php/ext" -m

      - name: Version de l'application (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e "const f='desktop/src-tauri/tauri.conf.json';const c=require('./'+f);c.version='$version';require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n')"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installeur
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.5.0 build

      - uses: actions/upload-artifact@v4
        with:
          name: MyRuns-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

  linux:
    # Ubuntu 22.04 : glibc 2.35, le .deb s'installe aussi sur Debian 12 et les Ubuntu récents.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, zip
          tools: composer:v2

      - name: Application Symfony (production)
        run: bin/prepare-desktop-app

      - name: PHP Linux embarqué
        run: |
          curl -fsSL -o php.tar.gz "https://dl.static-php.dev/static-php-cli/common/php-$PHP_LINUX_VERSION-cli-linux-x86_64.tar.gz"
          echo "$PHP_LINUX_SHA256  php.tar.gz" | sha256sum -c -
          mkdir -p desktop/build/php
          tar xzf php.tar.gz -C desktop/build/php
          chmod +x desktop/build/php/php
          # Extensions intégrées au binaire : les lignes extension= (DLL Windows) feraient échouer leur chargement.
          grep -vE '^(zend_)?extension=' desktop/php.ini > desktop/build/php/php.ini

          # Certificats racines : le chemin compilé (/etc/ssl/cert.pem) n'existe pas sur toutes les distributions.
          curl -fsSL -o desktop/build/php/cacert.pem https://curl.se/ca/cacert.pem
          expected="$(curl -fsSL https://curl.se/ca/cacert.pem.sha256 | cut -d' ' -f1)"
          echo "$expected  desktop/build/php/cacert.pem" | sha256sum -c -

          # Vérification : extensions utilisées par l'application.
          modules="$(desktop/build/php/php -c desktop/build/php/php.ini -m)"
          for extension in ctype curl fileinfo iconv mbstring openssl pdo_sqlite zip; do
            grep -qx "$extension" <<< "$modules" || { echo "Extension absente : $extension"; exit 1; }
          done

      - name: Version de l'application (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e "const f='desktop/src-tauri/tauri.conf.json';const c=require('./'+f);c.version='$version';require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n')"

      - name: Dépendances système de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installeurs
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.5.0 build

      - uses: actions/upload-artifact@v4
        with:
          name: MyRuns-linux
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release GitHub (brouillon)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "MyRuns $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/*
