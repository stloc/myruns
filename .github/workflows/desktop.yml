# Installeur Windows de l'application de bureau (Tauri + PHP embarqué).
# Pousser un tag « v0.2.0 » : l'installeur est joint à une release GitHub en brouillon, à publier à la main.
name: Application de bureau

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # PHP Windows officiel (windows.php.net), version et empreinte figées.
  PHP_WINDOWS_VERSION: 8.4.26
  PHP_WINDOWS_SHA256: da68394f9193b7f6b89d0c76861a4034ae10efee7fd55a7255d8118c2acf70d7

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, pdo_sqlite, zip
          tools: composer:v2

      - name: Application Symfony (production)
        shell: bash
        run: bin/prepare-desktop-app

      - name: PHP Windows embarqué
        shell: pwsh
        run: |
          $zip = "php-$env:PHP_WINDOWS_VERSION-nts-Win32-vs17-x64.zip"
          $urls = @("https://windows.php.net/downloads/releases/$zip", "https://windows.php.net/downloads/releases/archives/$zip")
          $downloaded = $false
          foreach ($url in $urls) {
            try { Invoke-WebRequest -Uri $url -OutFile $zip; $downloaded = $true; break } catch { Write-Host "Absent : $url" }
          }
          if (-not $downloaded) { throw "PHP $env:PHP_WINDOWS_VERSION introuvable" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:PHP_WINDOWS_SHA256) { throw "Empreinte SHA256 inattendue : $hash" }
          Expand-Archive $zip -DestinationPath desktop/build/php
          Copy-Item desktop/php.ini desktop/build/php/php.ini

          # Certificats racines pour HTTPS (intervals.icu, Anthropic) : PHP Windows n'en fournit pas.
          Invoke-WebRequest -Uri https://curl.se/ca/cacert.pem -OutFile desktop/build/php/cacert.pem
          Invoke-WebRequest -Uri https://curl.se/ca/cacert.pem.sha256 -OutFile cacert.pem.sha256
          $expected = ((Get-Content cacert.pem.sha256 -Raw) -split '\s+')[0].ToLower()
          $actual = (Get-FileHash desktop/build/php/cacert.pem -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Empreinte du cacert.pem inattendue" }

          # Vérification : extensions chargées par le PHP embarqué.
          & desktop/build/php/php.exe -c desktop/build/php/php.ini -d "extension_dir=desktop/build/php/ext" -m

      - name: Version de l'application (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e "const f='desktop/src-tauri/tauri.conf.json';const c=require('./'+f);c.version='$version';require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n')"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installeur
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2.5.0 build

      - uses: actions/upload-artifact@v4
        with:
          name: MyStrava-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Release GitHub (brouillon)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "MyStrava $GITHUB_REF_NAME" desktop/src-tauri/target/release/bundle/nsis/*.exe
